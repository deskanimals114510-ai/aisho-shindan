<script>
// 黒曜診断DAY_MASTER_TYPESと同じ並び順(index 0-9)
const DAY_MASTERS = [
  { emoji: '🌳', kanji: '甲', reading: 'きのえ', element: '木' },
  { emoji: '🌱', kanji: '乙', reading: 'きのと', element: '木' },
  { emoji: '☀️', kanji: '丙', reading: 'ひのえ', element: '火' },
  { emoji: '🕯️', kanji: '丁', reading: 'ひのと', element: '火' },
  { emoji: '⛰️', kanji: '戊', reading: 'つちのえ', element: '土' },
  { emoji: '🌾', kanji: '己', reading: 'つちのと', element: '土' },
  { emoji: '⚔️', kanji: '庚', reading: 'かのえ', element: '金' },
  { emoji: '💍', kanji: '辛', reading: 'かのと', element: '金' },
  { emoji: '🌊', kanji: '壬', reading: 'みずのえ', element: '水' },
  { emoji: '💧', kanji: '癸', reading: 'みずのと', element: '水' },
];
const ELEMENT_ORDER = ['木', '火', '土', '金', '水'];
const ELEMENT_EMOJI = { '木': '🌳', '火': '🔥', '土': '⛰️', '金': '⚔️', '水': '💧' };

// EN版: 黒曜診断day-master-types-en.jsで確立済みのローマ字表記(Kinoe/Kinoto等)を流用し、
// 姉妹サイトと表記を統一する(2026-09-05、EN対応追加時に新設)。
const DAY_MASTERS_EN = [
  { emoji: '🌳', name: 'Kinoe', element: 'Wood' },
  { emoji: '🌱', name: 'Kinoto', element: 'Wood' },
  { emoji: '☀️', name: 'Hinoe', element: 'Fire' },
  { emoji: '🕯️', name: 'Hinoto', element: 'Fire' },
  { emoji: '⛰️', name: 'Tsuchinoe', element: 'Earth' },
  { emoji: '🌾', name: 'Tsuchinoto', element: 'Earth' },
  { emoji: '⚔️', name: 'Kanoe', element: 'Metal' },
  { emoji: '💍', name: 'Kanoto', element: 'Metal' },
  { emoji: '🌊', name: 'Mizunoe', element: 'Water' },
  { emoji: '💧', name: 'Mizunoto', element: 'Water' },
];
const ELEMENT_ORDER_EN = ['Wood', 'Fire', 'Earth', 'Metal', 'Water'];
const ELEMENT_EMOJI_EN = { Wood: '🌳', Fire: '🔥', Earth: '⛰️', Metal: '⚔️', Water: '💧' };

let LANG = 'ja';
function getDayMasters() { return LANG === 'en' ? DAY_MASTERS_EN : DAY_MASTERS; }
function getElementOrder() { return LANG === 'en' ? ELEMENT_ORDER_EN : ELEMENT_ORDER; }
function getElementEmoji() { return LANG === 'en' ? ELEMENT_EMOJI_EN : ELEMENT_EMOJI; }

const UI_TEXT = {
  ja: {
    pageTitle: '黒曜診断 五行相性チェック | 相性診断',
    pageDescription: '黒曜診断の日主(生まれた日の干)から、あなたとお相手の五行の相性を無料でチェック。木・火・土・金・水、五行の相生相剋で相性を診断します。',
    eyebrow: 'COMPATIBILITY GUIDE',
    h1Html: '黒曜診断 <span class="grad-text">五行相性</span>チェック',
    lead: 'あなたとお相手の日主(生まれた日の干)を選ぶと、五行の相性を黒曜先生が占います。',
    labelMe: '🔮 あなたの日主',
    labelYou: '🔮 お相手の日主',
    checkBtn: '五行相性を見る 🔮',
    resultNote: 'これは五行(木・火・土・金・水)だけを見た簡易的な相性です。黒曜先生の詳しい鑑定は、生年月日そのものから占う黒曜診断でどうぞ。',
    linkKokuyo: '黒曜診断がまだの方はこちら',
    linkMbti: 'MBTI結果コードで相性を診断する',
    followLabel: '🐹 Desk Animalsをフォローする',
    footerDisclaimer: '本診断はエンタメ目的のコンテンツです。四柱推命の考え方をベースにしていますが、実際の鑑定に代わるものではありません。',
  },
  en: {
    pageTitle: 'Kokuyo Five-Element Compatibility Check | Compatibility Quiz',
    pageDescription: "Pick your day master (the heavenly stem of the day you were born) from Kokuyo Fortune, and free-check your five-element compatibility with someone. Sensei Kokuyo reads the generating and controlling cycles of Wood, Fire, Earth, Metal, and Water.",
    eyebrow: 'COMPATIBILITY GUIDE',
    h1Html: 'Kokuyo <span class="grad-text">Five-Element</span> Compatibility Check',
    lead: "Choose your and your match's day master (the heavenly stem of the day you were born), and Sensei Kokuyo will read your five-element compatibility.",
    labelMe: '🔮 Your Day Master',
    labelYou: "🔮 Their Day Master",
    checkBtn: 'Check Compatibility 🔮',
    resultNote: "This is a simplified reading based on the five elements (Wood, Fire, Earth, Metal, Water) alone. For a full reading straight from your actual birth date, try Sensei Kokuyo's full fortune quiz.",
    linkKokuyo: "Haven't tried Kokuyo Fortune yet? Start here",
    linkMbti: 'Check MBTI Compatibility With a Result Code',
    followLabel: '🐹 Follow Desk Animals',
    footerDisclaimer: 'This test is for entertainment purposes only. It is based on Four Pillars of Destiny concepts but is not a substitute for an actual professional reading.',
  },
};

// 相生(生む)・相剋(剋す)の一言テキスト(黒曜先生の声、五行の組み合わせに応じて要素名を差し込む)
function relationshipText(elA, elB, nameA, nameB) {
  if (elA === elB) {
    return {
      label: '比和(似た者同士)',
      body: `${nameA}も${nameB}も、同じ「${elA}」の気質よ。放っておいても分かり合える、楽な相性ね。ただし同じ気質は同じ弱点も分かち合うということ。二人でその弱点にはまり込まないよう、たまには真逆の意見をくれる誰かの声にも耳を傾けなさい。`,
    };
  }
  const iA = ELEMENT_ORDER.indexOf(elA), iB = ELEMENT_ORDER.indexOf(elB);
  if ((iA + 1) % 5 === iB) {
    return {
      label: `相生(${nameA}が${nameB}を育てる)`,
      body: `${elA}の${nameA}が、${elB}の${nameB}を育てる。与え、与えられる、支え合う相性よ。ただし与えすぎれば${nameA}がすり減るし、${nameB}は受け取るだけでは自立できない。${nameA}は見返りを求めないこと、${nameB}は受け取った分をいつか誰かに返す番だと忘れないこと。それができれば、長く続く良縁になるわ。`,
    };
  }
  if ((iB + 1) % 5 === iA) {
    return {
      label: `相生(${nameB}が${nameA}を育てる)`,
      body: `${elB}の${nameB}が、${elA}の${nameA}を育てる。与え、与えられる、支え合う相性よ。ただし与えすぎれば${nameB}がすり減るし、${nameA}は受け取るだけでは自立できない。${nameB}は見返りを求めないこと、${nameA}は受け取った分をいつか誰かに返す番だと忘れないこと。それができれば、長く続く良縁になるわ。`,
    };
  }
  if ((iA + 2) % 5 === iB) {
    return {
      label: `相剋(${nameA}が${nameB}を剋す)`,
      body: `${elA}の${nameA}が、${elB}の${nameB}を突き崩す。楽な相性ではないけれど、刃は砥石があってこそ研がれるもの。適度な緊張感が、互いを鍛える関係になり得るわ。ただし加減を誤れば本当に傷つけ合うことになる。${nameA}は加減を、${nameB}は逃げ場を、それぞれ持っておきなさい。`,
    };
  }
  // (iB + 2) % 5 === iA
  return {
    label: `相剋(${nameB}が${nameA}を剋す)`,
    body: `${elB}の${nameB}が、${elA}の${nameA}を突き崩す。楽な相性ではないけれど、刃は砥石があってこそ研がれるもの。適度な緊張感が、互いを鍛える関係になり得るわ。ただし加減を誤れば本当に傷つけ合うことになる。${nameB}は加減を、${nameA}は逃げ場を、それぞれ持っておきなさい。`,
  };
}

// EN版(Fable(claude-fable-5)による書き起こし、2026-09-05。黒曜先生の口調(厳しいが愛のある占い師)を
// 姉妹サイト黒曜診断のday-master-types-en.jsの既存EN文体を基準に踏襲。5パターン全て翻訳済み)。
function relationshipTextEN(elA, elB, nameA, nameB) {
  if (elA === elB) {
    return {
      label: 'Kindred Spirits (two of a kind)',
      body: `${nameA} and ${nameB} — you carry the same ${elA} nature. Leave the two of you alone and you'll understand each other without a word. An easy match. But hear this: the same nature means the same weak spots, too. Don't let the pair of you sink into that hollow together — every so often, lend an ear to someone who thinks the exact opposite of you both.`,
    };
  }
  const iA = ELEMENT_ORDER_EN.indexOf(elA), iB = ELEMENT_ORDER_EN.indexOf(elB);
  if ((iA + 1) % 5 === iB) {
    return {
      label: `Nurturing Bond (${nameA} nurtures ${nameB})`,
      body: `${nameA} of ${elA} nurtures ${nameB} of ${elB}. One gives, one receives, and together you hold each other up — a fine bond. But give too much and ${nameA} wears thin; take and only take, and ${nameB} never learns to stand alone. ${nameA}, give without counting what comes back. ${nameB}, never forget that what you've received, you'll one day owe to someone else. Manage that, and this is a tie that lasts.`,
    };
  }
  if ((iB + 1) % 5 === iA) {
    return {
      label: `Nurturing Bond (${nameB} nurtures ${nameA})`,
      body: `${nameB} of ${elB} nurtures ${nameA} of ${elA}. One gives, one receives, and together you hold each other up — a fine bond. But give too much and ${nameB} wears thin; take and only take, and ${nameA} never learns to stand alone. ${nameB}, give without counting what comes back. ${nameA}, never forget that what you've received, you'll one day owe to someone else. Manage that, and this is a tie that lasts.`,
    };
  }
  if ((iA + 2) % 5 === iB) {
    return {
      label: `Blade and Whetstone (${nameA} tempers ${nameB})`,
      body: `${nameA} of ${elA} cuts into ${nameB} of ${elB}. Not an easy match — I won't pretend otherwise. But a blade is only sharpened against a whetstone. The right measure of friction can be exactly what forges the two of you. Misjudge it, though, and you will truly wound each other. So ${nameA}, keep your restraint. ${nameB}, keep somewhere to retreat. Hold onto those — each of you.`,
    };
  }
  // (iB + 2) % 5 === iA
  return {
    label: `Blade and Whetstone (${nameB} tempers ${nameA})`,
    body: `${nameB} of ${elB} cuts into ${nameA} of ${elA}. Not an easy match — I won't pretend otherwise. But a blade is only sharpened against a whetstone. The right measure of friction can be exactly what forges the two of you. Misjudge it, though, and you will truly wound each other. So ${nameB}, keep your restraint. ${nameA}, keep somewhere to retreat. Hold onto those — each of you.`,
  };
}
function getRelationshipText(elA, elB, nameA, nameB) {
  return LANG === 'en' ? relationshipTextEN(elA, elB, nameA, nameB) : relationshipText(elA, elB, nameA, nameB);
}

let selMe = null, selYou = null;

function dmLabel(dm) {
  return LANG === 'en' ? `${dm.emoji} ${dm.name}` : `${dm.emoji} ${dm.kanji}`;
}
function dmName(dm) {
  return LANG === 'en' ? dm.name : `${dm.kanji}(${dm.reading})`;
}

function renderGrid(containerId, onSelect, getSelected) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const dayMasters = getDayMasters();
  dayMasters.forEach((dm, i) => {
    const btn = document.createElement('a');
    btn.className = 'type-nav-link';
    btn.href = '#';
    btn.textContent = dmLabel(dm);
    if (getSelected() === i) btn.classList.add('active');
    btn.dataset.index = i;
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      [...el.children].forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      onSelect(i);
    });
    el.appendChild(btn);
  });
}

function renderGrids() {
  renderGrid('grid-me', (i) => { selMe = i; updateButton(); }, () => selMe);
  renderGrid('grid-you', (i) => { selYou = i; updateButton(); }, () => selYou);
}

function updateButton() {
  document.getElementById('btn-check').disabled = !(selMe !== null && selYou !== null);
}

renderGrids();

function renderResultCard(scroll) {
  const dayMasters = getDayMasters();
  const me = dayMasters[selMe], you = dayMasters[selYou];
  const nameA = dmName(me), nameB = dmName(you);
  const emojiMap = getElementEmoji();
  const rel = getRelationshipText(me.element, you.element, nameA, nameB);
  const card = document.getElementById('result-card');
  card.innerHTML = `
    <span class="cat-name">${emojiMap[me.element]} ${me.emoji} ${nameA} × ${you.emoji} ${nameB} ${emojiMap[you.element]}</span>
    <div class="type-name">${rel.label}</div>
    <p class="desc">${rel.body}</p>
  `;
  document.getElementById('result-area').style.display = '';
  if (scroll) document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.getElementById('btn-check').addEventListener('click', () => {
  if (selMe === null || selYou === null) return;
  renderResultCard(true);
});

// ===== JA/EN切替(index.htmlと同じlang-toggleパターン、2026-09-05追加) =====
function applyLangUI() {
  const t = UI_TEXT[LANG];
  document.title = t.pageTitle;
  document.getElementById('page-title').textContent = t.pageTitle;
  document.getElementById('meta-description').setAttribute('content', t.pageDescription);
  document.getElementById('og-title').setAttribute('content', t.pageTitle);
  document.getElementById('og-description').setAttribute('content', t.pageDescription);
  document.getElementById('twitter-title').setAttribute('content', t.pageTitle);
  document.getElementById('twitter-description').setAttribute('content', t.pageDescription);
  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('page-h1').innerHTML = t.h1Html;
  document.getElementById('page-lead').textContent = t.lead;
  document.getElementById('label-grid-me').textContent = t.labelMe;
  document.getElementById('label-grid-you').textContent = t.labelYou;
  document.getElementById('btn-check').textContent = t.checkBtn;
  document.getElementById('link-kokuyo').textContent = t.linkKokuyo;
  document.getElementById('link-mbti').textContent = t.linkMbti;
  document.getElementById('follow-label').textContent = t.followLabel;
  document.getElementById('footer-disclaimer').textContent = t.footerDisclaimer;
  document.documentElement.lang = LANG;
  document.getElementById('result-note').textContent = t.resultNote;
  renderGrids();
  // 結果を既に表示中なら、選択済みの2人分だけ言語を切り替えて再描画する(スクロールはしない)
  const resultArea = document.getElementById('result-area');
  if (resultArea.style.display !== 'none' && selMe !== null && selYou !== null) {
    renderResultCard(false);
  }
}
function setLang(lang) {
  LANG = lang;
  document.getElementById('btn-lang-ja').classList.toggle('active', lang === 'ja');
  document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
  applyLangUI();
}
document.getElementById('btn-lang-ja').addEventListener('click', () => setLang('ja'));
document.getElementById('btn-lang-en').addEventListener('click', () => setLang('en'));
</script>
