<script>
// 黒曜診断DAY_MASTER_TYPESと同じ並び順(index 0-9)
const DAY_MASTERS = [
  { emoji: '🌳', kanji: '甲', reading: 'きのえ', element: '木' },
  { emoji: '🌱', kanji: '乙', reading: 'きのと', element: '木' },
  { emoji: '☀️', kanji: '丙', reading: 'ひのえ', element: '火' },
  { emoji: '🕯️', kanji: '丁', reading: 'ひのと', element: '火' },
  { emoji: '⛰️', kanji: '戊', reading: 'つちのえ', element: '土' },
  { emoji: '🌾', kanji: '己', reading: 'つちのと', element: '土' },
  { emoji: '⚔️', kanji: '庚', reading: 'かのえ', element: '金' },
  { emoji: '💍', kanji: '辛', reading: 'かのと', element: '金' },
  { emoji: '🌊', kanji: '壬', reading: 'みずのえ', element: '水' },
  { emoji: '💧', kanji: '癸', reading: 'みずのと', element: '水' },
];
const ELEMENT_ORDER = ['木', '火', '土', '金', '水'];
const ELEMENT_EMOJI = { '木': '🌳', '火': '🔥', '土': '⛰️', '金': '⚔️', '水': '💧' };

// 相生(生む)・相剋(剋す)の一言テキスト(黒曜先生の声、五行の組み合わせに応じて要素名を差し込む)
function relationshipText(elA, elB, nameA, nameB) {
  if (elA === elB) {
    return {
      label: '比和(似た者同士)',
      body: `${nameA}も${nameB}も、同じ「${elA}」の気質よ。放っておいても分かり合える、楽な相性ね。ただし同じ気質は同じ弱点も分かち合うということ。二人でその弱点にはまり込まないよう、たまには真逆の意見をくれる誰かの声にも耳を傾けなさい。`,
    };
  }
  const iA = ELEMENT_ORDER.indexOf(elA), iB = ELEMENT_ORDER.indexOf(elB);
  if ((iA + 1) % 5 === iB) {
    return {
      label: `相生(${nameA}が${nameB}を育てる)`,
      body: `${elA}の${nameA}が、${elB}の${nameB}を育てる。与え、与えられる、支え合う相性よ。ただし与えすぎれば${nameA}がすり減るし、${nameB}は受け取るだけでは自立できない。${nameA}は見返りを求めないこと、${nameB}は受け取った分をいつか誰かに返す番だと忘れないこと。それができれば、長く続く良縁になるわ。`,
    };
  }
  if ((iB + 1) % 5 === iA) {
    return {
      label: `相生(${nameB}が${nameA}を育てる)`,
      body: `${elB}の${nameB}が、${elA}の${nameA}を育てる。与え、与えられる、支え合う相性よ。ただし与えすぎれば${nameB}がすり減るし、${nameA}は受け取るだけでは自立できない。${nameB}は見返りを求めないこと、${nameA}は受け取った分をいつか誰かに返す番だと忘れないこと。それができれば、長く続く良縁になるわ。`,
    };
  }
  if ((iA + 2) % 5 === iB) {
    return {
      label: `相剋(${nameA}が${nameB}を剋す)`,
      body: `${elA}の${nameA}が、${elB}の${nameB}を突き崩す。楽な相性ではないけれど、刃は砥石があってこそ研がれるもの。適度な緊張感が、互いを鍛える関係になり得るわ。ただし加減を誤れば本当に傷つけ合うことになる。${nameA}は加減を、${nameB}は逃げ場を、それぞれ持っておきなさい。`,
    };
  }
  // (iB + 2) % 5 === iA
  return {
    label: `相剋(${nameB}が${nameA}を剋す)`,
    body: `${elB}の${nameB}が、${elA}の${nameA}を突き崩す。楽な相性ではないけれど、刃は砥石があってこそ研がれるもの。適度な緊張感が、互いを鍛える関係になり得るわ。ただし加減を誤れば本当に傷つけ合うことになる。${nameB}は加減を、${nameA}は逃げ場を、それぞれ持っておきなさい。`,
  };
}

let selMe = null, selYou = null;

function renderGrid(containerId, onSelect) {
  const el = document.getElementById(containerId);
  DAY_MASTERS.forEach((dm, i) => {
    const btn = document.createElement('a');
    btn.className = 'type-nav-link';
    btn.href = '#';
    btn.textContent = `${dm.emoji} ${dm.kanji}`;
    btn.dataset.index = i;
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      [...el.children].forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      onSelect(i);
    });
    el.appendChild(btn);
  });
}

function updateButton() {
  document.getElementById('btn-check').disabled = !(selMe !== null && selYou !== null);
}

renderGrid('grid-me', (i) => { selMe = i; updateButton(); });
renderGrid('grid-you', (i) => { selYou = i; updateButton(); });

document.getElementById('btn-check').addEventListener('click', () => {
  if (selMe === null || selYou === null) return;
  const me = DAY_MASTERS[selMe], you = DAY_MASTERS[selYou];
  const nameA = `${me.kanji}(${me.reading})`, nameB = `${you.kanji}(${you.reading})`;
  const rel = relationshipText(me.element, you.element, nameA, nameB);
  const card = document.getElementById('result-card');
  card.innerHTML = `
    <span class="cat-name">${ELEMENT_EMOJI[me.element]} ${me.emoji} ${nameA} × ${you.emoji} ${nameB} ${ELEMENT_EMOJI[you.element]}</span>
    <div class="type-name">${rel.label}</div>
    <p class="desc">${rel.body}</p>
  `;
  document.getElementById('result-area').style.display = '';
  document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
